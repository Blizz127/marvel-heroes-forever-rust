[package]
name = "marvel-heroes-forever"
version = "0.1.0-dev.12"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "marvel_heroes_forever"
path = "src/lib.rs"

[[bin]]
name = "mhf"
path = "src/main.rs"

[features]
default = []
renderer = ["dep:wgpu", "dep:pollster"]
window = ["renderer", "dep:winit"]

[dependencies]
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
pollster = { version = "=0.4.0", optional = true }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"], optional = true }

[profile.release]
opt-level = 2
lto = false
strip = "debuginfo"
