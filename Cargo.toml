[package]
name = "marvel-heroes-forever"
version = "0.1.0-dev.3"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "marvel_heroes_forever"
path = "src/lib.rs"

[[bin]]
name = "mhf"
path = "src/main.rs"

[features]
default = []
renderer = ["dep:wgpu", "dep:pollster"]

[dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }
pollster = { version = "=0.4.0", optional = true }

[profile.release]
opt-level = 2
lto = false
strip = "debuginfo"
